[project]
name = "takedown-watch"
version = "0.1.0"
description = "Takedown Watch capture pipeline: discover, fetch, extract, store and archive Bangladeshi news articles."
authors = [{ name = "Activate Rights" }]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "lxml>=5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "ruamel-yaml>=0.18",
    "sqlalchemy>=2.0,<2.1",
    "structlog>=24",
    "trafilatura>=2.0",
    "typer>=0.12",
]

[project.scripts]
tw = "tw.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tw"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = ["network: hits the live internet (deselect with -m 'not network')"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]
